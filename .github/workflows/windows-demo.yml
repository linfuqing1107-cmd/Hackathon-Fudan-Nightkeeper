name: Windows Demo EXE
on:
  workflow_dispatch:
  push:
    tags: ['windows-v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix desktop
      - run: python -m pip install -r integrations/watch/requirements.txt pyinstaller==6.19.0
      - run: python -m unittest discover -s integrations/watch -p "test_*.py" -v
      - run: node desktop/build.mjs
      - run: python -m PyInstaller --noconfirm --clean --onedir --name NightkeeperWatch --distpath desktop/resources/watch-dist --workpath integrations/watch/build --specpath integrations/watch --collect-all bleak --hidden-import tkinter --add-data "integrations/watch/dashboard.html;." integrations/watch/bridge.py
      - shell: pwsh
        run: Move-Item desktop/resources/watch-dist/NightkeeperWatch desktop/resources/watch
      - run: npm run pack --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npx playwright install chromium
      - run: node desktop/smoke.cjs
      - shell: pwsh
        run: Get-FileHash desktop/release/*.exe -Algorithm SHA256 | Format-List | Out-File desktop/release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nightkeeper-Windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/SHA256.txt
          retention-days: 14
